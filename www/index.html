<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Трактор в болоте</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #18271d;
      color: white;
      font-family: system-ui, sans-serif;
      touch-action: none;
    }
    canvas { display: block; width: 100vw; height: 100dvh; }
    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 10px 14px;
      border: 1px solid #ffffff33;
      border-radius: 14px;
      background: #101a16bb;
      font-weight: 700;
      line-height: 1.5;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 2;
    }
    .group { display: flex; gap: 12px; }
    button {
      width: 66px;
      height: 66px;
      border: 2px solid #ffffff88;
      border-radius: 20px;
      background: #17241ddd;
      color: white;
      font-size: 26px;
      font-weight: 800;
      touch-action: none;
      user-select: none;
    }
    button:active { background: #779632; transform: scale(.96); }
    #gas { background: #6b8c2cdd; }
    #message {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101a16aa;
      text-align: center;
    }
    #card {
      max-width: 360px;
      padding: 26px;
      border: 1px solid #ffffff44;
      border-radius: 24px;
      background: #1b2b20;
      box-shadow: 0 12px 50px #0008;
    }
    #card h1 { margin: 0 0 10px; font-size: 30px; }
    #card p { color: #d3dfd1; line-height: 1.5; }
    #start {
      width: auto;
      height: auto;
      padding: 13px 24px;
      border: 0;
      background: #83a93b;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    🏁 Путь: <span id="score">0</span> м<br>
    ❤️ Прочность: <span id="health">3</span>
  </div>

  <div id="controls">
    <div class="group">
      <button data-control="left" aria-label="Влево">◀</button>
      <button data-control="right" aria-label="Вправо">▶</button>
    </div>
    <div class="group">
      <button data-control="brake" aria-label="Тормоз">▼</button>
      <button id="gas" data-control="gas" aria-label="Газ">▲</button>
    </div>
  </div>

  <div id="message">
    <div id="card">
      <h1>🚜 Трактор в болоте</h1>
      <p>Объезжай топкие ямы и брёвна. Не съезжай с тропы — у трактора всего три жизни!</p>
      <button id="start">Поехали!</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const healthEl = document.getElementById("health");
    const message = document.getElementById("message");
    const startButton = document.getElementById("start");

    let W, H, dpr;
    let running = false;
    let distance = 0;
    let speed = 100;
    let health = 3;
    let playerX = 0;
    let steering = 0;
    let nextObstacle = 450;
    let obstacles = [];
    let lastTime = 0;
    let offRoadTime = 0;
    let hitFlash = 0;

    const held = { left: false, right: false, gas: false, brake: false };
    const scale = 0.72;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!running || !playerX) playerX = W / 2;
    }

    window.addEventListener("resize", resize);
    resize();

    function roadWidth() { return Math.min(W * 0.72, 420); }
    function roadCenter(world) {
      return W / 2 + Math.sin(world * 0.0022) * Math.min(W * 0.17, 90);
    }
    function worldAtY(y) {
      return distance + (H * 0.72 - y) / scale;
    }

    function startGame() {
      distance = 0;
      speed = 100;
      health = 3;
      playerX = W / 2;
      steering = 0;
      nextObstacle = 420;
      obstacles = [];
      offRoadTime = 0;
      hitFlash = 0;
      running = true;
      message.style.display = "none";
      lastTime = performance.now();
    }

    startButton.addEventListener("click", startGame);

    document.querySelectorAll("[data-control]").forEach(button => {
      const control = button.dataset.control;
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        held[control] = true;
        button.setPointerCapture(event.pointerId);
      });
      const release = event => {
        event.preventDefault();
        held[control] = false;
      };
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", () => held[control] = false);
    });

    window.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") held.left = true;
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") held.right = true;
      if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") held.gas = true;
      if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") held.brake = true;
    });
    window.addEventListener("keyup", event => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") held.left = false;
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") held.right = false;
      if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") held.gas = false;
      if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") held.brake = false;
    });

    function addObstacle() {
      const type = Math.random() < 0.72 ? "mud" : "log";
      const offset = (Math.random() - 0.5) * roadWidth() * 0.72;
      obstacles.push({
        distance: nextObstacle,
        x: roadCenter(nextObstacle) + offset,
        type,
        hit: false
      });
      nextObstacle += 260 + Math.random() * 260;
    }

    function drawBackground() {
      ctx.fillStyle = "#294b3b";
      ctx.fillRect(0, 0, W, H);

      // Болото и маленькие кочки
      for (let i = 0; i < 32; i++) {
        const x = (i * 137 + 43) % W;
        const y = ((i * 197 + distance * scale * 0.35) % (H + 80)) - 40;
        ctx.fillStyle = i % 2 ? "#365b46" : "#203f35";
        ctx.beginPath();
        ctx.ellipse(x, y, 13 + (i % 5) * 3, 5 + (i % 3) * 2, 0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Извилистая болотная тропа
      const left = [];
      const right = [];
      for (let y = -20; y <= H + 20; y += 24) {
        const c = roadCenter(worldAtY(y));
        const half = roadWidth() / 2;
        left.push([c - half, y]);
        right.push([c + half, y]);
      }

      ctx.beginPath();
      left.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      [...right].reverse().forEach(([x, y]) => ctx.lineTo(x, y));
      ctx.closePath();
      ctx.fillStyle = "#66553a";
      ctx.fill();

      ctx.beginPath();
      left.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.strokeStyle = "#9c814c";
      ctx.lineWidth = 5;
      ctx.stroke();

      ctx.beginPath();
      right.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.stroke();
    }

    function drawObstacle(obstacle, y) {
      if (obstacle.type === "mud") {
        ctx.fillStyle = "#192e27";
        ctx.beginPath();
        ctx.ellipse(obstacle.x, y, 25, 16, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#49614a";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = "#617449";
        ctx.beginPath();
        ctx.ellipse(obstacle.x - 7, y - 3, 7, 3, 0.2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.save();
        ctx.translate(obstacle.x, y);
        ctx.rotate(-0.15);
        ctx.fillStyle = "#754b2d";
        ctx.fillRect(-25, -7, 50, 14);
        ctx.fillStyle = "#a36f3d";
        ctx.fillRect(-22, -6, 44, 4);
        ctx.restore();
      }
    }

    function drawTractor() {
      const y = H * 0.72;
      ctx.save();
      ctx.translate(playerX, y);

      // Колёса
      ctx.fillStyle = "#20201c";
      ctx.fillRect(-23, -18, 10, 30);
      ctx.fillRect(13, -18, 10, 30);
      ctx.fillRect(-18, 8, 8, 18);
      ctx.fillRect(10, 8, 8, 18);

      // Корпус и кабина
      ctx.fillStyle = "#e7a72e";
      ctx.fillRect(-15, -20, 30, 38);
      ctx.fillStyle = "#f4c34d";
      ctx.fillRect(-12, -30, 24, 21);
      ctx.fillStyle = "#97c9c4";
      ctx.fillRect(-8, -27, 16, 13);
      ctx.fillStyle = "#d8512f";
      ctx.fillRect(-5, 11, 10, 10);

      // Фары
      ctx.fillStyle = "#fff2a1";
      ctx.fillRect(-13, -23, 5, 4);
      ctx.fillRect(8, -23, 5, 4);
      ctx.restore();
    }

    function draw() {
      drawBackground();

      obstacles.forEach(obstacle => {
        const y = H * 0.72 - (obstacle.distance - distance) * scale;
        if (y > -40 && y < H + 40) drawObstacle(obstacle, y);
      });

      drawTractor();

      if (hitFlash > 0) {
        ctx.fillStyle = `rgba(255,60,30,${hitFlash * 0.22})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function gameOver() {
      running = false;
      message.style.display = "grid";
      document.querySelector("#card h1").textContent = "💥 Трактор застрял!";
      document.querySelector("#card p").textContent =
        `Ты проехал ${Math.floor(distance / 10)} метров. Попробуешь ещё раз?`;
      startButton.textContent = "Ещё раз!";
    }

    function update(dt) {
      if (!running) return;

      const targetSpeed = held.gas ? 165 : held.brake ? 55 : 100;
      speed += (targetSpeed - speed) * Math.min(1, dt * 2.5);
      distance += speed * dt;

      const direction = (held.right ? 1 : 0) - (held.left ? 1 : 0);
      steering += (direction - steering) * Math.min(1, dt * 8);
      playerX += steering * (210 + speed * 0.55) * dt;
      playerX = Math.max(22, Math.min(W - 22, playerX));

      while (nextObstacle < distance + 800) addObstacle();

      const center = roadCenter(distance);
      const halfRoad = roadWidth() / 2;
      if (Math.abs(playerX - center) > halfRoad - 18) {
        offRoadTime += dt;
        if (offRoadTime > 1.5) {
          health--;
          offRoadTime = 0;
          hitFlash = 1;
        }
      } else {
        offRoadTime = Math.max(0, offRoadTime - dt * 1.5);
      }

      for (const obstacle of obstacles) {
        if (!obstacle.hit && Math.abs(obstacle.distance - distance) < 24 &&
            Math.abs(obstacle.x - playerX) < 34) {
          obstacle.hit = true;
          health--;
          speed *= 0.55;
          hitFlash = 1;
        }
      }

      obstacles = obstacles.filter(o => o.distance > distance - 100);
      hitFlash = Math.max(0, hitFlash - dt * 2.5);

      scoreEl.textContent = Math.floor(distance / 10);
      healthEl.textContent = "❤️".repeat(Math.max(0, health)) || "0";

      if (health <= 0) gameOver();
    }

    function frame(time) {
      const dt = Math.min((time - lastTime) / 1000 || 0, 0.04);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
